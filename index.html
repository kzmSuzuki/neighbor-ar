<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#317EFB" />
    <!-- キャッシュを無効化するためのメタタグ -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>3D CAD AR アプリケーション</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <a-scene
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
      vr-mode-ui="enabled: false"
    >
      <!-- カメラ -->
      <a-entity camera></a-entity>
      <a-light type="ambient" color="#ffffff"></a-light>

      <a-entity
        id="mouseCursor"
        cursor="rayOrigin: mouse"
        raycaster="objects: .raycastable"
      ></a-entity>

      <a-marker type="pattern" url="./marker/trash.patt">
        <a-entity
          position="0 1 0"
          hit-box
          data-name="ゴミ"
          data-icon="./icons/trash.png"
        >
          <a-entity
            class="raycastable"
            geometry="primitive:box"
            material="color:red; opacity: 0.5"
            scale="1 3 5"
            position="0 1 0"
            visible="true"
          ></a-entity>
        </a-entity>

        <a-entity
          position="0 1 5"
          rotation="-90 0 0"
          scale="0.5 0.5 0.5"
          gltf-model="./models/1.glb"
        ></a-entity>
      </a-marker>

      <a-marker type="pattern" url="./marker/aircon.patt">
        <a-entity
          position="0 1 0"
          hit-box
          data-name="エアコン"
          data-icon="./icons/aircon.png"
        >
          <a-entity
            class="raycastable"
            geometry="primitive:box"
            material="color:red; opacity: 0"
            scale="1 3 5"
            position="0 1 0"
            visible="false"
          ></a-entity>
        </a-entity>
        <a-entity
          position="0 1 5"
          rotation="-90 0 0"
          scale="0.5 0.5 0.5"
          gltf-model="./models/2.glb"
        ></a-entity>
      </a-marker>

            visible="false"

        </a-entity>
        <a-entity
          position="0 1 5"
          rotation="-90 0 0"
          scale="0.5 0.5 0.5"
          gltf-model="./models/3.glb"

      </a-marker>

    </a-scene>

    <!-- モーダル -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <p class="modal-subtitle">あなたが見つけたのは。。。</p>
        <img id="modal-icon" src="" alt="アイコン" />
        <p id="modal-message"></p>
        <p class="modal-subtext">
          ウインドウを閉じてスクショを撮ろう！3枚集めてTシャツをゲットしよう！
        </p>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      // サービスワーカーの登録と更新
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // 既存のサービスワーカーを強制的に更新
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.update();
            }
          });

          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => {
              console.log("Service Worker registered", reg);
              // サービスワーカーの更新をチェック
              reg.onupdatefound = function () {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === "installed") {
                    if (navigator.serviceWorker.controller) {
                      console.log(
                        "新しいサービスワーカーがインストールされました"
                      );
                      // 新しいバージョンがインストールされたらページをリロード
                      window.location.reload();
                    }
                  }
                };
              };
            })
            .catch((err) =>
              console.log("Service Worker registration failed", err)
            );
        });
      }

      AFRAME.registerComponent("hit-box", {
        init: function () {
          this.el.addEventListener("click", () => {
            const name = this.el.getAttribute("data-name");
            const icon = this.el.getAttribute("data-icon");
            showModal(name, icon);
          });
        },
      });

      function showModal(name, icon) {
        const modal = document.getElementById("modal");
        const modalIcon = document.getElementById("modal-icon");
        const modalMessage = document.getElementById("modal-message");

        modalIcon.src = icon;
        modalMessage.textContent = `${name}の隣人`;
        modal.style.display = "block";
      }

      // モーダルを閉じる
      const modal = document.getElementById("modal");
      const closeBtn = document.querySelector(".close");

      closeBtn.onclick = function () {
        modal.style.display = "none";
      };

      window.onclick = function (event) {
        if (event.target == modal) {
          modal.style.display = "none";
        }
      };
    </script>
  </body>
</html>
